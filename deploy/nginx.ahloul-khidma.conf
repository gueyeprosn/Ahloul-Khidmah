# Rate limit login / API
limit_req_zone $binary_remote_addr zone=ak_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ak_api:10m rate=30r/m;

# Cache pages marketing (bypass session admin + locale AR)
proxy_cache_path /var/cache/nginx/ahloul levels=1:2 keys_zone=ak_pages:32m
                 max_size=512m inactive=60m use_temp_path=off;

map $http_cookie $ak_skip_cache {
    default 0;
    ~*ak_session 1;
    ~*ak_locale=ar 1;
}

# HTTP → HTTPS (domaine principal ahloulkhidmah.org)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ahloulkhidmah.org www.ahloulkhidmah.org ahloulkhitmah.com www.ahloulkhitmah.com 191.218.163.29 _;

    client_max_body_size 1m;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://www.ahloulkhidmah.org$request_uri;
    }
}

# Ancien domaine .com → .org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ahloulkhitmah.com www.ahloulkhitmah.com;

    ssl_certificate     /etc/letsencrypt/live/ahloulkhitmah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahloulkhitmah.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.ahloulkhidmah.org$request_uri;
}

# Domaine principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ahloulkhidmah.org www.ahloulkhidmah.org;

    client_max_body_size 1m;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ahloulkhidmah.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahloulkhidmah.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "0" always;

    # apex → www
    if ($host = ahloulkhidmah.org) {
        return 301 https://www.ahloulkhidmah.org$request_uri;
    }

    # Assets brand / icons servis depuis le disque (sans Node)
    location ^~ /brand/ {
        alias /var/www/ahloul-khidma/public/brand/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /icons/ {
        alias /var/www/ahloul-khidma/public/icons/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/auth/login {
        limit_req zone=ak_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache ak_pages;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location /api/ {
        limit_req zone=ak_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Pages marketing cacheables (HTML)
    # Next envoie no-store → on ignore Cache-Control pour cacher côté Nginx
    location ~ ^/(mission|vision|faq|mentions-legales|confidentialite|contribuer|adhesion)/?$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache ak_pages;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache_bypass $ak_skip_cache $arg_montant;
        proxy_no_cache $ak_skip_cache $arg_montant;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=30, s-maxage=60" always;
    }

    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache ak_pages;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache_bypass $ak_skip_cache $arg_montant;
        proxy_no_cache $ak_skip_cache $arg_montant;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=15, s-maxage=30" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
