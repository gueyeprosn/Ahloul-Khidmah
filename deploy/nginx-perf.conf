# Perf HTTP Ahloul Khidmah — /etc/nginx/conf.d/ahloul-perf.conf
# (gzip est déjà activé dans nginx.conf)

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/xml+rss
  application/rss+xml
  image/svg+xml
  font/woff2
  application/manifest+json;
