<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orange Money">
  <rect width="64" height="64" rx="14" fill="#FF7900"/>
  <!-- Official-style Orange wordmark -->
  <text
    x="32"
    y="30"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="-0.4"
  >orange</text>
  <!-- Money pill -->
  <rect x="12" y="36" width="40" height="15" rx="7.5" fill="#FFFFFF"/>
  <text
    x="32"
    y="46.5"
    text-anchor="middle"
    fill="#FF7900"
    font-family="Helvetica, Arial, sans-serif"
    font-size="10"
    font-weight="800"
  >Money</text>
</svg>
